<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast Maker</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .box { width: 100%; max-width: 360px; }
  .box .card-b { display: grid; gap: 14px; }
  .brand { justify-content: center; font-size: 18px; margin-bottom: 18px; }
  .brand svg { width: 28px; height: 28px; }
  p { margin: 0; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="box">
  <div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M18.5 5 9 18h6.5L13.5 27 23 14h-6.5z" fill="var(--accent-ink)"/></svg>Fast Maker</div>
  <form class="card" id="f">
    <div class="card-b">
      <p id="lead">Sign in to the dashboard.</p>
      <div class="f"><label for="pw" id="pw-l">Password</label><input class="in" type="password" id="pw" autocomplete="current-password" required autofocus></div>
      <div class="f" id="pw2-f" hidden><label for="pw2">Repeat password</label><input class="in" type="password" id="pw2" autocomplete="new-password"></div>
      <button class="btn primary" type="submit" id="go" style="justify-content:center">Sign in</button>
      <span class="msg err" id="msg"></span>
    </div>
  </form>
</div>
<script>
"use strict";
const setup = location.pathname === "/setup";
if (setup) {
  document.getElementById("lead").textContent = "First run: choose a password for this dashboard (8+ characters). Anyone who can reach this page needs it.";
  document.getElementById("pw-l").textContent = "New password";
  document.getElementById("pw").autocomplete = "new-password";
  document.getElementById("pw2-f").hidden = false;
  document.getElementById("go").textContent = "Set password";
}
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value, msg = document.getElementById("msg");
  if (setup && pw !== document.getElementById("pw2").value) { msg.textContent = "The passwords don't match."; return; }
  const r = await fetch(setup ? "/setup" : "/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw }) });
  const d = await r.json().catch(() => ({}));
  if (r.ok) location.href = "/"; else msg.textContent = d.error || "Failed";
};
</script>
</body>
</html>
